    <animate attributeName="y" values="120;128;120" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </rect><rect x="1114.0" y="124" width="10" height="26" rx="2" fill="#34D399" fill-opacity="0.8500000000000001">
    <animate attributeName="height" values="26;44;26" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="124;106;124" dur="3s" begin="0.8s" repeatCount="indefinite"/>
