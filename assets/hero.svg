<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="t d">
  <title id="t">Ichrak Hamdi: Machine Learning Engineer and Data Scientist</title>
  <desc id="d">Banner with name, title, PhD research areas (reinforcement learning, industrial cyber-physical systems), and an animated data pipeline from raw data through ETL and a model to evaluation, above a reinforcement-learning loop where an agent acts on an industrial cyber-physical system and receives state and reward.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#121A33"/>
      <stop offset="1" stop-color="#1B1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <style>
      .h1{font:700 52px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC}
      .h2{font:600 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:url(#accent)}
      .h3{font:500 17px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#CBD5E1}
      .title{font:700 19px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC}
      .org{font:600 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#CBD5E1}
      .body{font:400 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
      .small{font:400 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .chip{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E2E8F0}
      .flow{stroke:url(#accent);stroke-width:2;stroke-dasharray:6 10;animation:dash 2.4s linear infinite}
      .node{fill:#0F172A;stroke-width:2}
      .lbl{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#CBD5E1}
      .alert{animation:alert 3s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-32}}
      @keyframes alert{0%,25%{opacity:0}35%,60%{opacity:1}75%,100%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="336" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="336" rx="18" fill="url(#grid)"/>

  <text x="64" y="92" class="h1">Ichrak Hamdi</text>
  <text x="66" y="132" class="h2">Machine Learning Engineer · Data Scientist</text>
  <text x="66" y="166" class="h3">PhD Researcher in Computer Science, Université Laval</text>
  <rect x="66" y="180" width="200" height="30" rx="15" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.7"/><text x="166" y="200" text-anchor="middle" class="lbl" style="fill:#E9D5FF">Reinforcement Learning</text>
<rect x="276" y="180" width="285" height="30" rx="15" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.7"/><text x="418" y="200" text-anchor="middle" class="lbl" style="fill:#E9D5FF">Industrial Cyber-Physical Systems</text>
  <text x="66" y="246" class="body" style="font-size:16px">End-to-end Python ML pipelines for real-world data:</text>
  <text x="66" y="268" class="body" style="font-size:16px">ETL, time series, signal processing and deep learning.</text>
  <rect x="66" y="288" width="73" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="102" y="307" text-anchor="middle" class="lbl">Python</text>
<rect x="149" y="288" width="49" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="174" y="307" text-anchor="middle" class="lbl">SQL</text>
<rect x="208" y="288" width="81" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="248" y="307" text-anchor="middle" class="lbl">PyTorch</text>
<rect x="299" y="288" width="104" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="351" y="307" text-anchor="middle" class="lbl">TensorFlow</text>
<rect x="413" y="288" width="112" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="469" y="307" text-anchor="middle" class="lbl">Time series</text>
<rect x="535" y="288" width="49" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="559" y="307" text-anchor="middle" class="lbl">ETL</text>
  <g transform="translate(0 8)">
  <line x1="776" y1="130" x2="808" y2="130" stroke="#334155" stroke-width="2"/>
<line x1="776" y1="130" x2="808" y2="130" class="flow"/>
<path id="l0" d="M776 130 H808" fill="none"/>
<circle r="4" fill="#38BDF8"><animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite"><mpath href="#l0"/></animateMotion></circle>
<line x1="904" y1="130" x2="936" y2="130" stroke="#334155" stroke-width="2"/>
<line x1="904" y1="130" x2="936" y2="130" class="flow"/>
<path id="l1" d="M904 130 H936" fill="none"/>
<circle r="4" fill="#A78BFA"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
<line x1="1032" y1="130" x2="1064" y2="130" stroke="#334155" stroke-width="2"/>
<line x1="1032" y1="130" x2="1064" y2="130" class="flow"/>
<path id="l2" d="M1032 130 H1064" fill="none"/>
<circle r="4" fill="#34D399"><animateMotion dur="1.6s" begin="1.0s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
  <rect x="680" y="70" width="96" height="120" rx="14" class="node" stroke="#22D3EE"/>
<text x="728.0" y="174" text-anchor="middle" class="lbl">data</text>
<rect x="808" y="70" width="96" height="120" rx="14" class="node" stroke="#38BDF8"/>
<text x="856.0" y="174" text-anchor="middle" class="lbl">ETL</text>
<rect x="936" y="70" width="96" height="120" rx="14" class="node" stroke="#A78BFA"/>
<text x="984.0" y="174" text-anchor="middle" class="lbl">model</text>
<rect x="1064" y="70" width="96" height="120" rx="14" class="node" stroke="#34D399"/>
<text x="1112.0" y="174" text-anchor="middle" class="lbl">eval</text>
  
  <!-- data: cylinder -->
  <ellipse cx="728.0" cy="102" rx="24" ry="8" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M704.0 102 V136 A24 8 0 0 0 752.0 136 V102" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M704.0 119 A24 8 0 0 0 752.0 119" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity=".6"/>
  <!-- ETL: funnel -->
  <path d="M830.0 96 H882.0 L864.0 120 V140 L848.0 148 V120 Z" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
  <!-- model: tiny network -->
  <line x1="962.0" y1="98" x2="984.0" y2="106" stroke="#A78BFA" stroke-opacity=".5"/><line x1="962.0" y1="98" x2="984.0" y2="134" stroke="#A78BFA" stroke-opacity=".5"/><line x1="962.0" y1="120" x2="984.0" y2="106" stroke="#A78BFA" stroke-opacity=".5"/><line x1="962.0" y1="120" x2="984.0" y2="134" stroke="#A78BFA" stroke-opacity=".5"/><line x1="962.0" y1="142" x2="984.0" y2="106" stroke="#A78BFA" stroke-opacity=".5"/><line x1="962.0" y1="142" x2="984.0" y2="134" stroke="#A78BFA" stroke-opacity=".5"/>
  <line x1="984.0" y1="106" x2="1006.0" y2="120" stroke="#A78BFA" stroke-opacity=".5"/><line x1="984.0" y1="134" x2="1006.0" y2="120" stroke="#A78BFA" stroke-opacity=".5"/>
  <circle cx="962.0" cy="98" r="5" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/><circle cx="962.0" cy="120" r="5" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/><circle cx="962.0" cy="142" r="5" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="984.0" cy="106" r="5" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/><circle cx="984.0" cy="134" r="5" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="1006.0" cy="120" r="5" fill="#A78BFA"/>
  <!-- eval: animated bars -->
  <rect x="1086.0" y="132" width="10" height="18" rx="2" fill="#34D399" fill-opacity="0.55">
    <animate attributeName="height" values="18;30;18" dur="3s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="132;120;132" dur="3s" begin="0.0s" repeatCount="indefinite"/>
  </rect><rect x="1100.0" y="120" width="10" height="30" rx="2" fill="#34D399" fill-opacity="0.7000000000000001">
    <animate attributeName="height" values="30;22;30" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="120;128;120" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </rect><rect x="1114.0" y="124" width="10" height="26" rx="2" fill="#34D399" fill-opacity="0.8500000000000001">
    <animate attributeName="height" values="26;44;26" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="124;106;124" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </rect><rect x="1128.0" y="110" width="10" height="40" rx="2" fill="#34D399" fill-opacity="1.0">
    <animate attributeName="height" values="40;50;40" dur="3s" begin="1.2000000000000002s" repeatCount="indefinite"/>
    <animate attributeName="y" values="110;100;110" dur="3s" begin="1.2000000000000002s" repeatCount="indefinite"/>
  </rect>
  </g>
  
  <rect x="680" y="216" width="480" height="92" rx="12" fill="#0F172A" stroke="#334155"/>
  <text x="694" y="234" class="lbl" style="font-size:11px;fill:#64748B">PhD research</text>
  <circle cx="752" cy="266" r="27" class="node" stroke="#A78BFA"/>
  <text x="752" y="264" text-anchor="middle" class="lbl" style="fill:#C4B5FD">RL</text>
  <text x="752" y="279" text-anchor="middle" class="lbl" style="font-size:10px">agent</text>
  <rect x="1010" y="240" width="134" height="52" rx="10" class="node" stroke="#F472B6"/>
  <path d="M1024 282 V262 L1033 268 V262 L1042 268 V262 L1051 268 V282 Z M1027 262 V250 H1033 V262" fill="none" stroke="#F472B6" stroke-width="2" stroke-linejoin="round"/>
  <text x="1100" y="262" text-anchor="middle" class="lbl">industrial</text>
  <text x="1100" y="280" text-anchor="middle" class="lbl">CPS</text>
  <circle cx="1140" cy="244" r="6" fill="#F43F5E" class="alert"/>
  <path id="act" d="M782 254 H1004" stroke="#334155" stroke-width="2" marker-end="url(#head)"/>
  <path id="obs" d="M1004 280 H782" stroke="#334155" stroke-width="2" marker-end="url(#head)"/>
  <text x="893" y="246" text-anchor="middle" class="lbl" style="font-size:11px;fill:#34D399">action</text>
  <text x="893" y="300" text-anchor="middle" class="lbl" style="font-size:11px;fill:#22D3EE">state · reward</text>
  <circle r="4" fill="#34D399"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#act"/></animateMotion></circle>
  <circle r="4" fill="#22D3EE"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#obs"/></animateMotion></circle>
</svg>
