  <circle cx="984.0" cy="106" r="5" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/><circle cx="984.0" cy="134" r="5" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="1006.0" cy="120" r="5" fill="#A78BFA"/>
