<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Ichrak Hamdi: PhD Researcher in Computer Science</title>
  <desc id="d">Banner with name, title and an animated network being protected by a learning agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#121A33"/>
      <stop offset="1" stop-color="#1B1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .name{font:700 52px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC}
      .role{font:600 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:url(#accent)}
      .sub{font:400 17px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
      .tag{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#CBD5E1}
      .edge{stroke:#334155;stroke-width:1.5}
      .flow{stroke:url(#accent);stroke-width:2;stroke-dasharray:6 10;animation:dash 2.4s linear infinite}
      .node{fill:#0F172A;stroke:#22D3EE;stroke-width:2}
      .plc{fill:#0F172A;stroke:#A78BFA;stroke-width:2}
      .threat{fill:#F43F5E;animation:blink 3s ease-in-out infinite}
      .shield{fill:none;stroke:#34D399;stroke-width:2.5;opacity:0;animation:shield 3s ease-in-out infinite}
      .pulse{fill:url(#glow);transform-origin:900px 160px;animation:pulse 3s ease-in-out infinite}
      .cursor{fill:#22D3EE;animation:caret 1s steps(1) infinite}
      @keyframes dash{to{stroke-dashoffset:-32}}
      @keyframes blink{0%,30%{opacity:0}35%,55%{opacity:1}60%,100%{opacity:0}}
      @keyframes shield{0%,50%{opacity:0}58%,85%{opacity:1}100%{opacity:0}}
      @keyframes pulse{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.1);opacity:1}}
      @keyframes caret{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- Text -->
  <text x="64" y="112" class="name">Ichrak Hamdi</text>
  <text x="66" y="152" class="role">PhD Researcher · Computer Science · Université Laval</text>
  <text x="66" y="192" class="sub">Reinforcement learning for autonomous, safety-aware</text>
  <text x="66" y="216" class="sub">cyberattack response in industrial cyber-physical systems.</text>
  <g transform="translate(66 252)">
    <rect width="72" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="36" y="19" text-anchor="middle" class="tag">RL</text>
    <rect x="82" width="104" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="134" y="19" text-anchor="middle" class="tag">ICS / OT</text>
    <rect x="196" width="80" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="236" y="19" text-anchor="middle" class="tag">CPS</text>
    <rect x="286" width="150" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="361" y="19" text-anchor="middle" class="tag">Deep Learning</text>
  </g>

  <!-- Network: agent in the middle defending industrial nodes -->
  <circle cx="900" cy="160" r="90" class="pulse"/>
  <g>
    <line x1="900" y1="160" x2="780" y2="80" class="edge"/>
    <line x1="900" y1="160" x2="1030" y2="78" class="edge"/>
    <line x1="900" y1="160" x2="770" y2="240" class="edge"/>
    <line x1="900" y1="160" x2="1040" y2="246" class="edge"/>
    <line x1="780" y1="80" x2="770" y2="240" class="edge"/>
    <line x1="1030" y1="78" x2="1040" y2="246" class="edge"/>
    <line x1="900" y1="160" x2="780" y2="80" class="flow"/>
    <line x1="900" y1="160" x2="1040" y2="246" class="flow"/>
    <line x1="900" y1="160" x2="770" y2="240" class="flow"/>
    <line x1="900" y1="160" x2="1030" y2="78" class="flow"/>
  </g>
  <!-- Industrial nodes -->
  <rect x="760" y="62" width="40" height="36" rx="6" class="plc"/>
  <text x="780" y="85" text-anchor="middle" class="tag" style="font-size:11px">PLC</text>
  <rect x="1010" y="60" width="40" height="36" rx="6" class="plc"/>
  <text x="1030" y="83" text-anchor="middle" class="tag" style="font-size:11px">HMI</text>
  <rect x="750" y="222" width="40" height="36" rx="6" class="plc"/>
  <text x="770" y="245" text-anchor="middle" class="tag" style="font-size:11px">RTU</text>
  <rect x="1020" y="228" width="40" height="36" rx="6" class="plc"/>
  <text x="1040" y="251" text-anchor="middle" class="tag" style="font-size:11px">SCADA</text>
  <!-- Threat appears on one node, then shield responds -->
  <circle cx="1060" cy="236" r="7" class="threat"/>
  <rect x="1012" y="220" width="56" height="52" rx="10" class="shield"/>
  <!-- Agent -->
  <circle cx="900" cy="160" r="34" class="node"/>
  <text x="900" y="156" text-anchor="middle" class="tag" style="font-size:12px;fill:#22D3EE">RL</text>
  <text x="900" y="173" text-anchor="middle" class="tag" style="font-size:11px">agent</text>
</svg>
