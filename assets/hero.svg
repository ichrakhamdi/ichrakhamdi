<path id="l2" d="M1032 130 H1064" fill="none"/>
<circle r="4" fill="#34D399"><animateMotion dur="1.6s" begin="1.0s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
  <rect x="680" y="70" width="96" height="120" rx="14" class="node" stroke="#22D3EE"/>
<text x="728.0" y="174" text-anchor="middle" class="lbl">data</text>
<rect x="808" y="70" width="96" height="120" rx="14" class="node" stroke="#38BDF8"/>
<text x="856.0" y="174" text-anchor="middle" class="lbl">ETL</text>
<rect x="936" y="70" width="96" height="120" rx="14" class="node" stroke="#A78BFA"/>
<text x="984.0" y="174" text-anchor="middle" class="lbl">model</text>
<rect x="1064" y="70" width="96" height="120" rx="14" class="node" stroke="#34D399"/>
<text x="1112.0" y="174" text-anchor="middle" class="lbl">eval</text>
  
