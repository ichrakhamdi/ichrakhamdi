    <animate attributeName="y" values="132;120;132" dur="3s" begin="0.0s" repeatCount="indefinite"/>
  </rect><rect x="1100.0" y="120" width="10" height="30" rx="2" fill="#34D399" fill-opacity="0.7000000000000001">
