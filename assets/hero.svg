<line x1="776" y1="130" x2="808" y2="130" class="flow"/>
<path id="l0" d="M776 130 H808" fill="none"/>
<circle r="4" fill="#38BDF8"><animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite"><mpath href="#l0"/></animateMotion></circle>
<line x1="904" y1="130" x2="936" y2="130" stroke="#334155" stroke-width="2"/>
<line x1="904" y1="130" x2="936" y2="130" class="flow"/>
<path id="l1" d="M904 130 H936" fill="none"/>
<circle r="4" fill="#A78BFA"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
<line x1="1032" y1="130" x2="1064" y2="130" stroke="#334155" stroke-width="2"/>
