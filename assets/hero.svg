<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Ichrak Hamdi: Machine Learning Engineer and Data Scientist</title>
  <desc id="d">Banner with name and title, and an animated data pipeline from raw data through ETL and a model to evaluation, above a scrolling signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#121A33"/>
      <stop offset="1" stop-color="#1B1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="waveclip"><rect x="680" y="236" width="480" height="56" rx="10"/></clipPath>
    <style>
      .h1{font:700 52px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC}
      .h2{font:600 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:url(#accent)}
      .h3{font:500 17px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#CBD5E1}
      .title{font:700 19px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC}
      .org{font:600 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#CBD5E1}
      .body{font:400 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
      .small{font:400 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .chip{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E2E8F0}
      .flow{stroke:url(#accent);stroke-width:2;stroke-dasharray:6 10;animation:dash 2.4s linear infinite}
      .node{fill:#0F172A;stroke-width:2}
      .lbl{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#CBD5E1}
      .wave{animation:slide 6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-32}}
      @keyframes slide{to{transform:translateX(-240px)}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <text x="64" y="104" class="h1">Ichrak Hamdi</text>
  <text x="66" y="146" class="h2">Machine Learning Engineer · Data Scientist</text>
  <text x="66" y="178" class="h3">PhD Researcher in Computer Science, Université Laval</text>
  <text x="66" y="212" class="body" style="font-size:16px">End-to-end Python ML pipelines for real-world data:</text>
  <text x="66" y="234" class="body" style="font-size:16px">ETL, time series, signal processing and deep learning.</text>
  <rect x="66" y="252" width="73" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="102" y="271" text-anchor="middle" class="lbl">Python</text>
<rect x="149" y="252" width="49" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="174" y="271" text-anchor="middle" class="lbl">SQL</text>
<rect x="208" y="252" width="81" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="248" y="271" text-anchor="middle" class="lbl">PyTorch</text>
<rect x="299" y="252" width="104" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="351" y="271" text-anchor="middle" class="lbl">TensorFlow</text>
<rect x="413" y="252" width="112" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="469" y="271" text-anchor="middle" class="lbl">Time series</text>
<rect x="535" y="252" width="49" height="28" rx="14" fill="#1E293B" stroke="#334155"/><text x="559" y="271" text-anchor="middle" class="lbl">ETL</text>
