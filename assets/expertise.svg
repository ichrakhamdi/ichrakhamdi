<rect x="225" y="462" width="64" height="26" rx="13" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.45"/><text x="257" y="479" text-anchor="middle" class="chip">Hadoop</text>
