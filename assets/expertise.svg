<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
  <title id="t">What I do</title>
  <desc id="d">Six areas: ML engineering, time series and signals, deep learning and vision, data engineering, code review and evaluation, and AI for cybersecurity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#121A33"/>
      <stop offset="1" stop-color="#1B1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .h1{font:700 52px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC}
      .h2{font:600 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:url(#accent)}
      .h3{font:500 17px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#CBD5E1}
      .title{font:700 19px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC}
      .org{font:600 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#CBD5E1}
      .body{font:400 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
      .small{font:400 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .chip{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E2E8F0}
      .num{font:600 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .t{font:700 27px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC}
      .p{font:400 19px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#A8B3C4}
      .tools{font:500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7C8BA1}
    </style>
  </defs>
  <rect width="1200" height="660" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="660" rx="18" fill="url(#grid)"/>
<line x1="600" y1="56" x2="600" y2="604" stroke="#1E293B" stroke-width="1.5"/>
<line x1="56" y1="218" x2="1144" y2="218" stroke="#1E293B" stroke-width="1.5"/>
<line x1="56" y1="414" x2="1144" y2="414" stroke="#1E293B" stroke-width="1.5"/>
<text x="56" y="76" class="num" fill="#22D3EE">01</text>
<text x="96" y="78" class="t">ML Engineering</text>
<text x="96" y="116" class="p">Built and maintained ML pipelines for epilepsy</text>
<text x="96" y="143" class="p">health data at Knowlepsy, from raw data to model.</text>
<text x="96" y="182" class="tools">Python · Pandas · NumPy · scikit-learn</text>
<text x="628" y="76" class="num" fill="#A78BFA">02</text>
<text x="668" y="78" class="t">Time Series &amp; Signals</text>
<text x="668" y="116" class="p">Forecasting and signal processing on large,</text>
<text x="668" y="143" class="p">noisy sensor datasets.</text>
<text x="668" y="182" class="tools">Forecasting · Signal processing · IoT</text>
<text x="56" y="272" class="num" fill="#F472B6">03</text>
<text x="96" y="274" class="t">Deep Learning &amp; Vision</text>
<text x="96" y="312" class="p">Segmentation, emotion recognition and attack</text>
<text x="96" y="339" class="p">detection with CNNs, U-Net, LSTMs, Transformers.</text>
<text x="96" y="378" class="tools">PyTorch · TensorFlow · OpenCV</text>
<text x="628" y="272" class="num" fill="#FBBF24">04</text>
<text x="668" y="274" class="t">Data Engineering</text>
<text x="668" y="312" class="p">ETL workflows and IoT data integration</text>
<text x="668" y="339" class="p">on Azure, from SQL to streaming.</text>
<text x="668" y="378" class="tools">SQL · Azure · Kafka · Hadoop · Docker</text>
<text x="56" y="468" class="num" fill="#34D399">05</text>
<text x="96" y="470" class="t">Code Review &amp; Evaluation</text>
<text x="96" y="508" class="p">Reviewing, debugging and grading code in</text>
<text x="96" y="535" class="p">5 university courses; evaluating AI agents.</text>
<text x="96" y="574" class="tools">Debugging · Written feedback · Agent evaluation</text>
<text x="628" y="468" class="num" fill="#60A5FA">06</text>
<text x="668" y="470" class="t">AI for Cybersecurity</text>
<text x="668" y="508" class="p">PhD research on AI agents that defend</text>
<text x="668" y="535" class="p">industrial cyber-physical systems.</text>
<text x="668" y="574" class="tools">Reinforcement learning · ICS / OT</text>
</svg>
