<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Experience timeline</title>
  <desc id="d">Timeline from 2022 to 2026: AI Intern at Talan Tunisie, AI Research Intern at UQAT, ML Research Engineer at Knowlepsy, PhD in Computer Science at Université Laval, and Course Lecturer and TA at Université Laval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
